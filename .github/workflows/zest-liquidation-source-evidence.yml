name: Zest v0-4 Liquidation Source Evidence

on:
  push:
    branches:
      - validation-susdh-donation-poc
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove deployed Zest v0-4 liquidation semantics
        run: node tests/security/standalone/read-zest-v04-liquidation-source.mjs

      - name: Extract deployed Zest egroup liquidation parameter interface
        run: node tests/security/standalone/read-zest-v04-egroup-source.mjs

      - name: Resolve deployed liquidation penalty values for hBTC masks
        run: node tests/security/standalone/read-zest-v04-egroup-values.mjs

      - name: Recover historical hBTC Zest open transactions
        run: node tests/security/standalone/read-historical-hbtc-zest-opens.mjs

      - name: Verify live hBTC standard exit fee
        run: node tests/security/standalone/read-live-hbtc-fees.mjs

      - name: Upload deployed-source evidence
        uses: actions/upload-artifact@v4
        with:
          name: zest-v04-liquidation-source
          path: |
            tests/security/evidence/zest-v04-liquidation-source.txt
            tests/security/evidence/zest-v04-egroup-source.txt
            tests/security/evidence/zest-v04-egroup-values.txt
            tests/security/evidence/hbtc-historical-zest-opens.json
          if-no-files-found: error
