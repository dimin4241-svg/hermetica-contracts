name: Hermetica Security Validation PoCs

on:
  push:
    branches:
      - validation-susdh-donation-poc
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run stale-NAV external-loss value-transfer PoC
        run: node tests/security/stale-nav/run-stale-nav-poc.mjs
