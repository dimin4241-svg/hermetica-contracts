name: Hermetica Security Validation PoCs

on:
  push:
    branches:
      - validation-susdh-donation-poc
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run stale-NAV external-loss value-transfer PoC
        run: node tests/security/stale-nav/run-stale-nav-poc.mjs

      - name: Run reconciled-NAV negative control
        run: node tests/security/stale-nav/run-reconciled-control.mjs

      - name: Run Critical token-level direct payout A/B proof
        run: node tests/security/stale-nav/run-critical-direct-payout-ab-poc.mjs

      - name: Run positive-PnL force-funding High A/B proof
        run: node tests/security/stale-nav/run-positive-pnl-force-funding-ab-poc.mjs

      - name: Run M-03 separation + mature-claim timing triager control
        run: node tests/security/stale-nav/run-triager-m03-separation-and-timing-poc.mjs

      - name: Run minimal 1bp stale-NAV value-transfer PoC
        run: node tests/security/stale-nav/run-1bp-minimal-loss-poc.mjs

      - name: Run zero-reserve neutral-funder stale-NAV PoC
        run: node tests/security/stale-nav/run-zero-reserve-neutral-funder-poc.mjs

      - name: Run stale-NAV live-limits blocking PoC
        run: node tests/security/stale-nav/run-live-limits-blocking-poc.mjs

      - name: Run stale-NAV live-limits exact value-transfer + PR137 bypass PoC
        run: node tests/security/stale-nav/run-live-limits-value-transfer-poc.mjs

      - name: Run existing-holder stale loss-shift PoC
        run: node tests/security/stale-nav/run-live-limits-existing-holder-loss-shift-poc.mjs

      - name: Run reserve-fund buffered stale loss-shift PoC
        run: node tests/security/stale-nav/run-reserve-fund-buffer-loss-shift-poc.mjs

      - name: Run M-04 permanent burn-dust remediation bypass PoC
        run: node tests/security/m04-burn-dust/run-m04-burn-dust-remediation-bypass-poc.mjs

      - name: Read live hBTC permanent burn dust
        run: node tests/security/standalone/read-live-hbtc-burn-dust.mjs

      - name: Verify live hBTC standard exit fee
        run: node tests/security/standalone/read-live-hbtc-fees.mjs

      - name: Read live hBTC accounting and reachability controls
        run: node tests/security/standalone/read-live-hbtc-controls.mjs

      - name: Read live hBTC / Zest position state
        run: node tests/security/standalone/read-live-hbtc-risk.mjs

      - name: Scan production hBTC negative reward history
        if: always()
        run: node tests/security/standalone/read-live-hbtc-negative-reward-history.mjs

      - name: Scan production hBTC positive reward history
        if: always()
        run: node tests/security/standalone/read-live-hbtc-positive-reward-history.mjs

      - name: Prove deployed Zest v0-4 liquidation source semantics
        if: always()
        run: node tests/security/standalone/read-zest-v04-liquidation-source.mjs

      - name: Upload compact Zest deployed-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zest-v04-liquidation-source
          path: tests/security/evidence/zest-v04-liquidation-source.txt
          if-no-files-found: error

      - name: Reconstruct live hBTC external registry
        if: always()
        run: node tests/security/standalone/read-live-hbtc-externals.mjs

      - name: Reconstruct live hBTC protocol roles
        if: always()
        run: node tests/security/standalone/read-live-hbtc-protocol-roles.mjs

      - name: Upload live hBTC protocol role evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-hbtc-protocol-roles
          path: tests/security/evidence/live-hbtc-protocol-roles.json
          if-no-files-found: error

      - name: Scan live hBTC custom fee and cooldown overrides
        if: always()
        run: node tests/security/standalone/read-live-hbtc-custom-overrides.mjs

      - name: Upload live hBTC custom override evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-hbtc-custom-overrides
          path: tests/security/evidence/live-hbtc-custom-overrides.json
          if-no-files-found: error
