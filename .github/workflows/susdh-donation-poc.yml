name: Hermetica Security Validation PoCs

on:
  push:
    branches:
      - validation-susdh-donation-poc
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run standalone sUSDh donation PoC
        run: node tests/security/standalone/run-donation-poc.mjs

      - name: Run standalone tx-sender confused-deputy PoCs
        run: node tests/security/standalone/run-confused-deputy-pocs.mjs

      - name: Run in-scope hBTC token theft PoC
        run: node tests/security/standalone/run-hbtc-token-theft-poc.mjs

      - name: Read live staking state (read-only)
        run: node tests/security/standalone/read-live-staking-state.mjs

      - name: Inspect current sUSDh holder concentration (read-only)
        run: node tests/security/standalone/read-susdh-holders.mjs
