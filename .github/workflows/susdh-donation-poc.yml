name: Hermetica Security Validation PoCs

on:
  push:
    branches:
      - validation-susdh-donation-poc
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run sUSDh donation PoC
        run: npm test -- tests/security/susdh-donation-poc.test.ts -- --manifest tests/security/standalone/Clarinet.toml

      - name: Run tx-sender confused-deputy PoCs
        run: npm test -- tests/security/tx-sender-confused-deputy-poc.test.ts -- --manifest tests/security/standalone/Clarinet.toml
