name: Live hBTC recent claims scan

on:
  push:
    branches: [evidence/live-hbtc-role-readonly]
    paths: [.github/workflows/live-unfunded-claims.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read recent live claims only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { Cl, serializeCV, deserializeCV, cvToString } from '@stacks/transactions';
          const O='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const V='vault-hbtc-v1-2';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function ro(id){
            const arg='0x'+serializeCV(Cl.uint(id));
            for(let i=0;i<8;i++){
              const r=await fetch(`https://api.hiro.so/v2/contracts/call-read/${O}/${V}/get-claim`,{
                method:'POST',headers:{'content-type':'application/json'},
                body:JSON.stringify({sender:O,arguments:[arg]})
              });
              if(r.status===429){await sleep(1800+i*900);continue;}
              if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
              const j=await r.json();
              if(!j.okay) return null;
              return cvToString(deserializeCV(j.result));
            }
            return 'RATE_LIMIT';
          }
          const now=Math.floor(Date.now()/1000);
          console.log(`NOW=${now}`);
          for(let id=110;id<=116;id++){
            const repr=await ro(id);
            if(!repr){console.log(`CLAIM_${id}=MISSING`);continue;}
            if(repr==='RATE_LIMIT'){console.log(`CLAIM_${id}=RATE_LIMIT`);continue;}
            const isUnfunded=repr.includes('(assets none)');
            const isExpress=repr.includes('(is-express true)');
            const ts=Number(repr.match(/\(ts u(\d+)\)/)?.[1]||0);
            console.log('RECENT_CLAIM='+JSON.stringify({id,isUnfunded,isExpress,ts,isMature:ts>0&&ts<=now,repr}));
            await sleep(800);
          }
          NODE
