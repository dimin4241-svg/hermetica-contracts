name: Complete live hBTC role map

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-complete-role-map.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fold every HQ role update event into current role map
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const O='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const HQ=`${O}.hq-hbtc-v1`;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(url){
            for(let i=0;i<12;i++){
              const r=await fetch(url,{headers:{accept:'application/json'}});
              if(r.status===429){await sleep(1200+i*900);continue;}
              if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
              return await r.json();
            }
            throw new Error('rate limit '+url);
          }
          const latest=new Map();
          let total=0;
          for(let offset=0;offset<3000;offset+=50){
            const p=await req(`https://api.hiro.so/extended/v1/contract/${HQ}/events?limit=50&offset=${offset}`);
            const rows=p.results??[];
            for(const e of rows){
              const repr=e?.contract_log?.value?.repr??'';
              if(!repr.includes('(action "confirm-update")')) continue;
              // Example data contains address, type, is-add.
              const addr=repr.match(/\(address '([^\)]+)\)/)?.[1] ?? repr.match(/\(address \(some '([^\)]+)\)\)/)?.[1];
              const type=repr.match(/\(type (0x[0-9a-fA-F]+)\)/)?.[1];
              const add=repr.includes('(is-add true)');
              if(!addr||!type) continue;
              total++;
              const key=`${type}:${addr}`;
              if(!latest.has(key)) latest.set(key,{type,addr,active:add,tx_id:e.tx_id,repr}); // newest-first endpoint
            }
            if(rows.length<50) break;
            await sleep(200);
          }
          console.log(`CONFIRMED_ROLE_EVENTS=${total}`);
          const names={'0x01':'GUARDIAN','0x02':'TRADER','0x03':'REWARDER','0x04':'MANAGER','0x05':'FEE_SETTER','0x06':'PROTOCOL'};
          const active=[...latest.values()].filter(v=>v.active).sort((a,b)=>a.type.localeCompare(b.type)||a.addr.localeCompare(b.addr));
          for(const v of active) console.log('ACTIVE_ROLE='+JSON.stringify({...v,role:names[v.type]||v.type,isContract:v.addr.includes('.')}));
          console.log(`ACTIVE_ROLE_COUNT=${active.length}`);
          const protocol=active.filter(v=>v.type==='0x06');
          console.log(`ACTIVE_PROTOCOL_COUNT=${protocol.length}`);
          for(const v of protocol) console.log('ACTIVE_PROTOCOL='+JSON.stringify(v));
          const protocolEOA=protocol.filter(v=>!v.addr.includes('.'));
          console.log(`ACTIVE_PROTOCOL_EOA_COUNT=${protocolEOA.length}`);
          NODE
