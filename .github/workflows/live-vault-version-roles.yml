name: Live hBTC capability graph

on:
  push:
    branches: [evidence/live-hbtc-role-readonly]
    paths: [.github/workflows/live-vault-version-roles.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Reconstruct current role set from HQ events
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const O='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const HQ=`${O}.hq-v1`;
          const roleNames={'0x01':'GUARDIAN','0x02':'TRADER','0x03':'REWARDER','0x04':'MANAGER','0x05':'FEE_SETTER','0x06':'PROTOCOL'};
          const state=new Map();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(url){
            for(let i=0;i<10;i++){
              const r=await fetch(url,{headers:{accept:'application/json'}});
              if(r.status===429){await sleep(1200+i*700);continue;}
              if(!r.ok) throw new Error(`${r.status} ${url} ${await r.text()}`);
              return r.json();
            }
            throw new Error('rate-limit');
          }
          let count=0;
          for(let offset=0;offset<600;offset+=50){
            const p=await get(`https://api.hiro.so/extended/v1/contract/${HQ}/events?limit=50&offset=${offset}`);
            const rows=p.results??[];
            for(const e of rows){
              const repr=e?.contract_log?.value?.repr??'';
              if(!repr.includes('(action "confirm-update")')) continue;
              const m=repr.match(/\(address '([^\)]+)\).*\(is-add (true|false)\).*\(type (0x[0-9a-fA-F]+)\)/);
              if(!m) continue;
              const [,address,add,type]=m;
              const role=roleNames[type]??type;
              state.set(`${type}|${address}`,add==='true');
              console.log('ROLE_EVENT='+JSON.stringify({role,type,address,is_add:add==='true',tx_id:e.tx_id,event_index:e.event_index,repr}));
              count++;
            }
            if(rows.length<50) break;
            await sleep(120);
          }
          console.log(`ROLE_EVENTS=${count}`);
          for(const [key,active] of state){
            if(!active) continue;
            const [type,address]=key.split('|');
            console.log('ACTIVE_ROLE='+JSON.stringify({role:roleNames[type]??type,type,address}));
          }
          NODE
