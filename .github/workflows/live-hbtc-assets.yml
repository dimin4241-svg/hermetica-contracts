name: Live hBTC asset inventory

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-assets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current State asset set from events
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const O='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const STATE=`${O}.state-hbtc-v1`;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(url){
            for(let i=0;i<10;i++){
              const r=await fetch(url,{headers:{accept:'application/json'}});
              if(r.status===429){await sleep(1200+i*800);continue;}
              if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
              return await r.json();
            }
            throw new Error('rate limit '+url);
          }
          const latest=new Map();
          for(let offset=0;offset<1800;offset+=50){
            const p=await req(`https://api.hiro.so/extended/v1/contract/${STATE}/events?limit=50&offset=${offset}`);
            const rows=p.results??[];
            for(const e of rows){
              const repr=e?.contract_log?.value?.repr??'';
              if(!repr.includes('(action "confirm-update")')) continue;
              // ASSET update type 0xa0; event contains address + is-add.
              if(!repr.includes('(type 0xa0)')) continue;
              const addr=repr.match(/\(address \(some '([^\)]+)\)\)/)?.[1];
              const add=repr.includes('(is-add true)');
              if(addr && !latest.has(addr)) latest.set(addr,{active:add,tx_id:e.tx_id,repr});
            }
            if(rows.length<50) break;
            await sleep(200);
          }
          for(const [address,v] of latest) console.log('ASSET='+JSON.stringify({address,...v}));
          NODE
