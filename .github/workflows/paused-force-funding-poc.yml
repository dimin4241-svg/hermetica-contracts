name: Paused Force-Funding PoC

on:
  push:
    branches:
      - validation-susdh-donation-poc
  workflow_dispatch:

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run paused permissionless force-funding A/B proof
        run: npx vitest run tests/security/pause-force-fund/paused-force-funding-freeze.test.ts --reporter=verbose

      - name: Scan live hBTC redemption pause history
        run: node tests/security/standalone/read-live-hbtc-redeem-pause-history.mjs

      - name: Upload live redemption pause evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-hbtc-redeem-pause-history
          path: tests/security/evidence/live-hbtc-redeem-pause-history.json
          if-no-files-found: error
