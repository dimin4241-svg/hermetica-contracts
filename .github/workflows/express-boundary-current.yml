name: Exact-current hBTC express boundary PoC

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/express-boundary-current.yml
      - tests/security/express-boundary/run-current-poc.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run exact-current express boundary PoC
        run: node tests/security/express-boundary/run-current-poc.mjs
