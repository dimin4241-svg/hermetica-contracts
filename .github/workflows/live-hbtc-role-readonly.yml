name: Live hBTC external-integration semantic diff probe

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compare live USDh contracts used by hBTC with repository source
        shell: bash
        run: |
          set -euo pipefail
          USDH='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG'
          mkdir -p /tmp/usdh-diff

          normalize() {
            local src="$1" dst="$2"
            cp "$src" "$dst"
            sed -i \
              -e 's/\.minting-auto-state-v1/\.minting-auto-state/g' \
              -e 's/\.minting-state-v1/\.minting-state/g' \
              -e 's/\.minting-auto-v1-2/\.minting-auto/g' \
              -e 's/\.redeeming-reserve-v1-2/\.redeeming-reserve/g' \
              -e 's/\.staking-state-v1/\.staking-state/g' \
              -e 's/\.staking-reserve-v1/\.staking-reserve/g' \
              -e 's/\.staking-silo-v1-1/\.staking-silo/g' \
              -e 's/\.staking-v1-1/\.staking/g' \
              -e 's/\.usdh-token-v1/\.usdh-token/g' \
              -e 's/\.susdh-token-v1/\.susdh-token/g' \
              -e 's/\.blacklist-susdh-v1/\.blacklist-susdh/g' \
              -e 's/\.hq-v1/\.hq/g' \
              "$dst"
          }

          compare_one() {
            local live="$1" path="$2"
            local raw="/tmp/usdh-diff/${live}.raw.clar"
            local norm="/tmp/usdh-diff/${live}.norm.clar"
            curl --fail-with-body -sS \
              "https://api.hiro.so/v2/contracts/source/${USDH}/${live}?proof=0" \
              | jq -r '.source' > "$raw"
            normalize "$raw" "$norm"
            if cmp -s "$norm" "$path"; then
              echo "RESULT|${live}|BYTE_EXACT_AFTER_ALIAS_NORMALIZATION"
            else
              echo "RESULT|${live}|DIFFERENT"
              echo "--- DIFF ${live} -> ${path} ---"
              diff -u "$norm" "$path" || true
              echo "--- END DIFF ${live} ---"
            fi
          }

          compare_one minting-auto-v1-2 mainnet/contracts/usdh/protocol/minting-auto-v1-2.clar
          compare_one minting-auto-state-v1 mainnet/contracts/usdh/protocol/minting-auto-state-v1.clar
          compare_one staking-v1-1 mainnet/contracts/usdh/protocol/staking-v1-1.clar
          compare_one staking-silo-v1-1 mainnet/contracts/usdh/protocol/staking-silo-v1-1.clar
