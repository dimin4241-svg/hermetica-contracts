name: Live hBTC read-only role matrix

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Query all deployed/prior hBTC principals against live HQ
        shell: bash
        run: |
          set -euo pipefail

          HBTC='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D'
          HQ_NAME='hq-v1'

          clarity_principal() {
            PRINCIPAL="$1" node --input-type=module <<'NODE'
          import { Cl, serializeCV } from '@stacks/transactions';
          const raw = serializeCV(Cl.principal(process.env.PRINCIPAL));
          if (typeof raw === 'string') console.log(raw.startsWith('0x') ? raw : '0x' + raw);
          else console.log('0x' + Buffer.from(raw).toString('hex'));
          NODE
          }

          call_role() {
            local fn="$1" arg="$2"
            curl --fail-with-body -sS -X POST -H 'content-type: application/json' \
              "https://api.hiro.so/v2/contracts/call-read/${HBTC}/${HQ_NAME}/${fn}" \
              --data "{\"sender\":\"${HBTC}\",\"arguments\":[\"${arg}\"]}" \
              | jq -r '.result // .cause // .'
          }

          printf '%-34s %-7s %-8s %-9s %-9s %-10s %-10s\n' contract trader manager rewarder protocol guardian fee_setter
          while IFS='|' read -r LABEL NAME; do
            PRINCIPAL="${HBTC}.${NAME}"
            ARG="$(clarity_principal "$PRINCIPAL")"
            TRADER="$(call_role get-trader "$ARG")"
            MANAGER="$(call_role get-manager "$ARG")"
            REWARDER="$(call_role get-rewarder "$ARG")"
            PROTOCOL="$(call_role get-protocol "$ARG")"
            GUARDIAN="$(call_role get-guardian "$ARG")"
            FEESETTER="$(call_role get-fee-setter "$ARG")"
            printf '%-34s %-7s %-8s %-9s %-9s %-10s %-10s\n' "$LABEL" "$TRADER" "$MANAGER" "$REWARDER" "$PROTOCOL" "$GUARDIAN" "$FEESETTER"
          done <<'EOF'
          state|state-hbtc-v1
          blacklist|blacklist-v1
          vault_v1|vault-hbtc-v1
          vault_v1_1|vault-hbtc-v1-1
          vault_v1_2|vault-hbtc-v1-2
          token|token-hbtc
          reserve|reserve-hbtc-v1
          trading|trading-hbtc-v1
          zest_interface|zest-interface-hbtc-v1
          hermetica_interface|hermetica-interface-hbtc-v1
          controller|controller-hbtc-v1
          reserve_fund|reserve-fund-hbtc-v1
          fee_collector_hbtc|fee-collector-hbtc-v1
          fee_collector|fee-collector-v1
          EOF
