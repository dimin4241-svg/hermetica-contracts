name: Live hBTC deployed-source diff probe

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch immutable deployed v1-2 source and compare with repository master
        shell: bash
        run: |
          set -euo pipefail
          URL='https://api.hiro.so/v2/contracts/source/SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D/vault-hbtc-v1-2?proof=0'
          curl --fail-with-body -sS "$URL" -o /tmp/deployed.json
          jq -r '.source' /tmp/deployed.json > /tmp/deployed.clar

          echo '=== metadata ==='
          jq '{publish_height, proof}' /tmp/deployed.json
          echo "deployed_bytes=$(wc -c </tmp/deployed.clar)"
          echo "master_bytes=$(wc -c <mainnet/contracts/hbtc/protocol/vault-v1-2.clar)"
          echo "deployed_sha256=$(sha256sum /tmp/deployed.clar | cut -d' ' -f1)"
          echo "master_sha256=$(sha256sum mainnet/contracts/hbtc/protocol/vault-v1-2.clar | cut -d' ' -f1)"

          if cmp -s /tmp/deployed.clar mainnet/contracts/hbtc/protocol/vault-v1-2.clar; then
            echo 'DEPLOYED_VS_MASTER=BYTE_EXACT'
          else
            echo 'DEPLOYED_VS_MASTER=DIFFERENT'
            diff -u /tmp/deployed.clar mainnet/contracts/hbtc/protocol/vault-v1-2.clar || true
          fi
