name: Live USDh staking-silo migration probe

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read old/new silo counters and boundary claims
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Cl, serializeCV, deserializeCV, cvToJSON } from '@stacks/transactions';
          const A='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function hex(cv){const x=serializeCV(cv); return typeof x==='string'?(x.startsWith('0x')?x:'0x'+x):'0x'+Buffer.from(x).toString('hex');}
          async function read(name,fn,args=[]){
            const url=`https://api.hiro.so/v2/contracts/call-read/${A}/${name}/${fn}`;
            const body=JSON.stringify({sender:A,arguments:args.map(hex)});
            for(let i=0;i<8;i++){
              const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body});
              if(r.status===429){await sleep(2500+i*1500);continue;}
              if(!r.ok) throw new Error(`${name}.${fn}: ${r.status} ${await r.text()}`);
              const j=await r.json(); return {raw:j.result,decoded:j.result?cvToJSON(deserializeCV(j.result)):j};
            }
            throw new Error('rate limit');
          }
          for(const name of ['staking-silo-v1','staking-silo-v1-1']){
            const x=await read(name,'get-current-claim-id');
            console.log(`${name}.current=${JSON.stringify(x.decoded)}`);
          }
          for(const id of [1233,1234,1235,1236]){
            for(const name of ['staking-silo-v1','staking-silo-v1-1']){
              const x=await read(name,'get-claim',[Cl.uint(id)]);
              console.log(`${name}.claim.${id}=${JSON.stringify(x.decoded)}`);
              await sleep(300);
            }
          }
          NODE
