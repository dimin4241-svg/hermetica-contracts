name: Live hBTC deployed-source semantic diff probe

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Normalize deployment aliases and compare v1-2 logic
        shell: bash
        run: |
          set -euo pipefail
          URL='https://api.hiro.so/v2/contracts/source/SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D/vault-hbtc-v1-2?proof=0'
          curl --fail-with-body -sS "$URL" -o /tmp/deployed.json
          jq -r '.source' /tmp/deployed.json > /tmp/deployed.clar

          cp /tmp/deployed.clar /tmp/normalized.clar
          sed -i \
            -e 's/\.reserve-hbtc-v1/\.reserve/g' \
            -e 's/\.fee-collector-hbtc-v1/\.fee-collector/g' \
            -e 's/\.state-hbtc-v1/\.state/g' \
            -e 's/\.blacklist-v1/\.blacklist/g' \
            -e 's/\.hq-v1/\.hq-hbtc/g' \
            /tmp/normalized.clar

          echo "deployed_sha256=$(sha256sum /tmp/deployed.clar | cut -d' ' -f1)"
          echo "normalized_sha256=$(sha256sum /tmp/normalized.clar | cut -d' ' -f1)"
          echo "master_sha256=$(sha256sum mainnet/contracts/hbtc/protocol/vault-v1-2.clar | cut -d' ' -f1)"

          if cmp -s /tmp/normalized.clar mainnet/contracts/hbtc/protocol/vault-v1-2.clar; then
            echo 'NORMALIZED_DEPLOYED_VS_MASTER=BYTE_EXACT'
          else
            echo 'NORMALIZED_DEPLOYED_VS_MASTER=DIFFERENT'
            diff -u /tmp/normalized.clar mainnet/contracts/hbtc/protocol/vault-v1-2.clar || true
          fi
