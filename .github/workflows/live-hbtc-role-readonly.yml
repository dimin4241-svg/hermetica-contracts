name: Live hBTC deployed-core semantic diff probe

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compare immutable deployed core/interface logic with master
        shell: bash
        run: |
          set -euo pipefail
          HBTC='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D'
          mkdir -p /tmp/hbtc-diff

          normalize() {
            local src="$1" dst="$2"
            cp "$src" "$dst"
            sed -i \
              -e 's/\.reserve-hbtc-v1/\.reserve/g' \
              -e 's/\.reserve-fund-hbtc-v1/\.reserve-fund/g' \
              -e 's/\.fee-collector-hbtc-v1/\.fee-collector/g' \
              -e 's/\.state-hbtc-v1/\.state/g' \
              -e 's/\.blacklist-v1/\.blacklist/g' \
              -e 's/\.hq-v1/\.hq-hbtc/g' \
              -e 's/\.controller-hbtc-v1/\.controller-hbtc/g' \
              -e 's/\.zest-interface-hbtc-v1/\.zest-interface/g' \
              -e 's/\.hermetica-interface-hbtc-v1/\.hermetica-interface/g' \
              -e 's/\.trading-hbtc-v1/\.trading/g' \
              "$dst"
          }

          compare_one() {
            local live="$1" path="$2"
            local raw="/tmp/hbtc-diff/${live}.raw.clar"
            local norm="/tmp/hbtc-diff/${live}.norm.clar"
            curl --fail-with-body -sS \
              "https://api.hiro.so/v2/contracts/source/${HBTC}/${live}?proof=0" \
              | jq -r '.source' > "$raw"
            normalize "$raw" "$norm"
            if cmp -s "$norm" "$path"; then
              echo "RESULT|${live}|BYTE_EXACT_AFTER_ALIAS_NORMALIZATION"
            else
              echo "RESULT|${live}|DIFFERENT"
              echo "--- DIFF ${live} -> ${path} ---"
              diff -u "$norm" "$path" || true
              echo "--- END DIFF ${live} ---"
            fi
          }

          compare_one state-hbtc-v1 mainnet/contracts/hbtc/protocol/state-v1.clar
          compare_one trading-hbtc-v1 mainnet/contracts/hbtc/protocol/trading-v1.clar
          compare_one zest-interface-hbtc-v1 mainnet/contracts/hbtc/protocol/interfaces/zest-interface-v1.clar
          compare_one hermetica-interface-hbtc-v1 mainnet/contracts/hbtc/protocol/interfaces/hermetica-interface-v1.clar
          compare_one controller-hbtc-v1 mainnet/contracts/hbtc/protocol/controller-v1.clar
          compare_one reserve-hbtc-v1 mainnet/contracts/hbtc/protocol/reserve-v1.clar
          compare_one reserve-fund-hbtc-v1 mainnet/contracts/hbtc/protocol/reserve-fund-v1.clar
