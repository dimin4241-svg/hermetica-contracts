name: Live USDh minting-auto whitelist probe

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate set-whitelist print events from deployed minting-auto-state-v1
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const CONTRACT='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG.minting-auto-state-v1';
          const API_KEY=process.env.HIRO_API_KEY || '';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function getJson(url){
            for(let i=0;i<10;i++){
              const headers={accept:'application/json'};
              if(API_KEY) headers['x-api-key']=API_KEY;
              const r=await fetch(url,{headers});
              if(r.status===429){await sleep(1500+i*1200);continue;}
              if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
              return await r.json();
            }
            throw new Error('rate limit');
          }

          const matches=[];
          let totalEvents=0;
          for(let offset=0; offset<1000; offset+=50){
            const page=await getJson(`https://api.hiro.so/extended/v1/contract/${CONTRACT}/events?limit=50&offset=${offset}`);
            const rows=page.results ?? [];
            totalEvents += rows.length;
            for(const e of rows){
              const repr=e?.contract_log?.value?.repr ?? '';
              if(repr.includes('minter') && repr.includes('redeemer') && repr.includes('price-slippage')){
                matches.push({tx_id:e.tx_id,event_index:e.event_index,repr});
              }
            }
            if(rows.length<50) break;
            await sleep(API_KEY?30:250);
          }
          console.log(`TOTAL_EVENTS_SCANNED=${totalEvents}`);
          console.log(`WHITELIST_EVENTS=${matches.length}`);
          for(const m of matches) console.log('WHITELIST_EVENT=' + JSON.stringify(m));
          NODE
