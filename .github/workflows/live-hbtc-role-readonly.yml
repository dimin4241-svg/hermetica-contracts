name: Live hBTC Pyth fee and staleness probe

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read Pyth fee, interface STX balance, and recent 10-block time spans
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { deserializeCV, cvToJSON } from '@stacks/transactions';

          const PYTH='SP1CGXWEAMG6P6FT04W66NVGJ7PQWMDAC19R7PJ0Y';
          const HIF='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D.hermetica-interface-hbtc-v1';
          const API_KEY=process.env.HIRO_API_KEY || '';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function getJson(url){
            for(let attempt=0; attempt<10; attempt++){
              const headers={'accept':'application/json'};
              if(API_KEY) headers['x-api-key']=API_KEY;
              const r=await fetch(url,{headers});
              if(r.status===429){await sleep(1500+attempt*1500);continue;}
              if(!r.ok) throw new Error(`${url}: HTTP ${r.status} ${await r.text()}`);
              return await r.json();
            }
            throw new Error(`rate limit: ${url}`);
          }

          async function callRead(addr,name,fn){
            const headers={'content-type':'application/json'};
            if(API_KEY) headers['x-api-key']=API_KEY;
            const url=`https://api.hiro.so/v2/contracts/call-read/${addr}/${name}/${fn}`;
            for(let attempt=0;attempt<10;attempt++){
              const r=await fetch(url,{method:'POST',headers,body:JSON.stringify({sender:addr,arguments:[]})});
              if(r.status===429){await sleep(1500+attempt*1500);continue;}
              if(!r.ok) throw new Error(`${fn}: HTTP ${r.status} ${await r.text()}`);
              const j=await r.json();
              if(!j.result) throw new Error(`${fn}: ${JSON.stringify(j)}`);
              return cvToJSON(deserializeCV(j.result));
            }
            throw new Error(`rate limit: ${fn}`);
          }

          console.log(`hiro_api_key_present=${API_KEY?'yes':'no'}`);

          const fee=await callRead(PYTH,'pyth-governance-v3','get-fee-info');
          console.log('PYTH_FEE_INFO=' + JSON.stringify(fee));

          const balances=await getJson(`https://api.hiro.so/extended/v1/address/${HIF}/balances`);
          console.log('HIF_STX_BALANCE=' + (balances?.stx?.balance ?? 'UNKNOWN'));
          console.log('HIF_STX_TOTAL_SENT=' + (balances?.stx?.total_sent ?? 'UNKNOWN'));
          console.log('HIF_STX_TOTAL_RECEIVED=' + (balances?.stx?.total_received ?? 'UNKNOWN'));

          const inbound=await getJson(`https://api.hiro.so/extended/v1/address/${HIF}/stx_inbound?limit=50&offset=0`);
          console.log(`HIF_STX_INBOUND_COUNT_PAGE=${inbound?.results?.length ?? 0}`);
          for(const x of (inbound?.results ?? []).slice(0,10)){
            console.log('HIF_STX_INBOUND=' + JSON.stringify({sender:x.sender,amount:x.amount,block_height:x.block_height,tx_id:x.tx_id,transfer_type:x.transfer_type}));
          }

          // Fetch 1,020 recent canonical Stacks blocks via Hiro's documented
          // /extended/v1/block endpoint (max 30/page), then calculate exact
          // wall-clock spans between height h and h-10.
          const blocks=[];
          for(let offset=0; offset<1020; offset+=30){
            const page=await getJson(`https://api.hiro.so/extended/v1/block?limit=30&offset=${offset}`);
            for(const b of (page.results ?? [])){
              if(b.canonical !== false && Number.isFinite(Number(b.height)) && Number.isFinite(Number(b.block_time))){
                blocks.push({height:Number(b.height),time:Number(b.block_time),hash:b.hash});
              }
            }
            await sleep(API_KEY?30:180);
          }
          const byHeight=new Map(blocks.map(b=>[b.height,b]));
          const spans=[];
          for(const b of blocks){
            const prev=byHeight.get(b.height-10);
            if(prev){
              const seconds=b.time-prev.time;
              if(seconds>=0) spans.push({height:b.height,seconds,from:prev.time,to:b.time,hash:b.hash});
            }
          }
          spans.sort((a,b)=>a.seconds-b.seconds);
          const pct=p=>spans[Math.min(spans.length-1,Math.max(0,Math.floor((spans.length-1)*p)))];
          const max=spans.at(-1);
          const over=(n)=>spans.filter(x=>x.seconds>n).length;
          console.log(`BLOCKS_FETCHED=${blocks.length}`);
          console.log(`TEN_BLOCK_SPANS=${spans.length}`);
          console.log(`TEN_BLOCK_P50=${pct(.50)?.seconds ?? 'NA'}`);
          console.log(`TEN_BLOCK_P90=${pct(.90)?.seconds ?? 'NA'}`);
          console.log(`TEN_BLOCK_P99=${pct(.99)?.seconds ?? 'NA'}`);
          console.log(`TEN_BLOCK_MAX=${max?.seconds ?? 'NA'}`);
          console.log(`TEN_BLOCK_OVER_120S=${over(120)}`);
          console.log(`TEN_BLOCK_OVER_300S=${over(300)}`);
          console.log(`TEN_BLOCK_OVER_600S=${over(600)}`);
          for(const x of spans.slice(-10).reverse()) console.log('TEN_BLOCK_TOP=' + JSON.stringify(x));
          NODE
