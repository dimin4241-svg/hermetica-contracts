name: Live hBTC migration balance probe

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Query old/current vault token balances and claim counter
        shell: bash
        run: |
          set -euo pipefail

          HBTC='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D'
          SBTC='SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4'

          clarity_principal() {
            PRINCIPAL="$1" node --input-type=module <<'NODE'
          import { Cl, serializeCV } from '@stacks/transactions';
          const raw = serializeCV(Cl.principal(process.env.PRINCIPAL));
          if (typeof raw === 'string') console.log(raw.startsWith('0x') ? raw : '0x' + raw);
          else console.log('0x' + Buffer.from(raw).toString('hex'));
          NODE
          }

          decode_cv() {
            RESULT="$1" node --input-type=module <<'NODE'
          import * as stacks from '@stacks/transactions';
          const raw = process.env.RESULT;
          try {
            const cv = stacks.deserializeCV(raw);
            if (typeof stacks.cvToJSON === 'function') console.log(JSON.stringify(stacks.cvToJSON(cv)));
            else if (typeof stacks.cvToValue === 'function') console.log(JSON.stringify(stacks.cvToValue(cv)));
            else console.log(JSON.stringify(cv));
          } catch (e) { console.log(JSON.stringify({decode_error:String(e), raw})); }
          NODE
          }

          call_read() {
            local addr="$1" name="$2" fn="$3" args_json="$4"
            curl --fail-with-body -sS -X POST -H 'content-type: application/json' \
              "https://api.hiro.so/v2/contracts/call-read/${addr}/${name}/${fn}" \
              --data "{\"sender\":\"${HBTC}\",\"arguments\":${args_json}}" \
              | jq -r '.result // .cause // .'
          }

          CLAIM_RAW="$(call_read "$HBTC" state-hbtc-v1 get-claim-id '[]')"
          echo "global_claim_id_raw=$CLAIM_RAW"
          echo "global_claim_id_decoded=$(decode_cv "$CLAIM_RAW")"

          echo '=== vault balances ==='
          while IFS='|' read -r LABEL NAME; do
            PRINCIPAL="${HBTC}.${NAME}"
            ARG="$(clarity_principal "$PRINCIPAL")"
            HRAW="$(call_read "$HBTC" token-hbtc get-balance "[\"${ARG}\"]")"
            SRAW="$(call_read "$SBTC" sbtc-token get-balance "[\"${ARG}\"]")"
            echo "${LABEL}=${PRINCIPAL}"
            echo "  hbtc_raw=$HRAW"
            echo "  hbtc_decoded=$(decode_cv "$HRAW")"
            echo "  sbtc_raw=$SRAW"
            echo "  sbtc_decoded=$(decode_cv "$SRAW")"
            sleep 0.3
          done <<'EOF'
          vault_v1|vault-hbtc-v1
          vault_v1_1|vault-hbtc-v1-1
          vault_v1_2|vault-hbtc-v1-2
          EOF
