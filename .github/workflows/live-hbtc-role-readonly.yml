name: Live USDh FLH invariant probe

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable FLH source and print execution/callback body
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            'https://api.hiro.so/v2/contracts/source/SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7/flh?proof=0' \
            | jq -r '.source' > /tmp/flh.clar
          echo '=== FLH lines 100-245 ==='
          nl -ba /tmp/flh.clar | sed -n '100,245p'
          echo '=== all external calls ==='
          grep -n 'contract-call?' /tmp/flh.clar || true
          echo '=== maps/data vars ==='
          grep -nE '^\(define-(data-var|map|constant)' /tmp/flh.clar || true
