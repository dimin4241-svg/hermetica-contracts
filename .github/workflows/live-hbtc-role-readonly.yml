name: Live hBTC atomic sweep reward evidence lightweight

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe state balances event counts and role history
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const OWNER='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const STATE=`${OWNER}.state-hbtc-v1`;
          const TOKEN=`${OWNER}.token-hbtc`;
          const RESERVE=`${OWNER}.reserve-hbtc-v1`;
          const ZEST=`${OWNER}.zest-interface-hbtc-v1`;
          const CTRL=`${OWNER}.controller-hbtc-v1`;
          const HQ=`${OWNER}.hq-v1`;
          const TRADING=`${OWNER}.trading-hbtc-v1`;
          const KEY=process.env.HIRO_API_KEY||'';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function hdr(extra={}){const h={accept:'application/json',...extra};if(KEY)h['x-api-key']=KEY;return h;}
          async function req(url,opts={}){
            for(let i=0;i<8;i++){
              const r=await fetch(url,{...opts,headers:{...hdr(),...(opts.headers||{})}});
              if(r.status===429){await sleep(800+i*800);continue;}
              if(!r.ok) throw new Error(`${r.status} ${url} ${await r.text()}`);
              return await r.json();
            }
            throw new Error(`rate limit ${url}`);
          }
          async function ro(contract,fn){
            const dot=contract.indexOf('.');
            const j=await req(`https://api.hiro.so/v2/contracts/call-read/${contract.slice(0,dot)}/${contract.slice(dot+1)}/${fn}`,{
              method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:OWNER,arguments:[]})
            });
            if(!j.okay) throw new Error(`${fn}: ${JSON.stringify(j)}`);
            return j.result;
          }
          function unwrap(v){let h=String(v).replace(/^0x/,'');if(h.startsWith('07'))h=h.slice(2);return h;}
          function u(v){const h=unwrap(v);if(!h.startsWith('01'))throw new Error(`uint ${v}`);return BigInt('0x'+h.slice(2));}
          function b(v){const h=unwrap(v).slice(0,2);if(h==='03')return true;if(h==='04')return false;throw new Error(`bool ${v}`);}
          for(const fn of ['get-total-assets','get-net-assets','get-deposit-cap','get-share-price','get-pending-fees','get-pending-rf','get-last-log-ts','get-max-reward','get-max-deviation']) console.log(`LIVE_${fn}=${u(await ro(STATE,fn))}`);
          for(const fn of ['get-deposit-enabled','get-reward-enabled','get-trading-enabled']) console.log(`LIVE_${fn}=${b(await ro(STATE,fn))}`);
          console.log(`LIVE_get-total-supply=${u(await ro(TOKEN,'get-total-supply'))}`);

          for(const [label,address] of [['RESERVE',RESERVE],['ZEST',ZEST],['TRADING',TRADING]]){
            const x=await req(`https://api.hiro.so/extended/v1/address/${address}/balances`);
            console.log(`${label}_FT=${JSON.stringify(x.fungible_tokens??{})}`);
          }

          async function firstPage(contract){return await req(`https://api.hiro.so/extended/v1/contract/${contract}/events?limit=50&offset=0`);}
          for(const [label,contract,needle] of [['ZEST',ZEST,'(action "sweep")'],['CTRL',CTRL,'(action "log-reward")'],['HQ',HQ,TRADING]]){
            const p=await firstPage(contract);
            console.log(`${label}_EVENT_TOTAL=${p.total??'unknown'}`);
            console.log(`${label}_PAGE_COUNT=${(p.results??[]).length}`);
            for(const e of (p.results??[])){
              const repr=e?.contract_log?.value?.repr??'';
              if(repr.includes(needle)) console.log(`${label}_MATCH=`+JSON.stringify({tx_id:e.tx_id,event_index:e.event_index,block_height:e.block_height,repr}));
            }
          }

          // HQ is low volume: scan up to 300 events to reconstruct role changes for Trading.
          for(let offset=0;offset<300;offset+=50){
            const p=await req(`https://api.hiro.so/extended/v1/contract/${HQ}/events?limit=50&offset=${offset}`);
            for(const e of (p.results??[])){
              const repr=e?.contract_log?.value?.repr??'';
              if(repr.includes(TRADING) && (repr.includes('confirm-update')||repr.includes('request-update'))) console.log('HQ_ROLE_EVENT='+JSON.stringify({tx_id:e.tx_id,event_index:e.event_index,block_height:e.block_height,repr}));
            }
            if((p.results??[]).length<50) break;
          }
          NODE
