name: Live USDh zero custom-cooldown principals

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Collapse custom cooldown history to current state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const C='SPN5AKG35QZSK2M8GAMR4AFX45659RJHDW353HSG.staking-state-v1';
          const KEY=process.env.HIRO_API_KEY||'';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function getJson(url){
            for(let i=0;i<10;i++){
              const h={accept:'application/json'}; if(KEY) h['x-api-key']=KEY;
              const r=await fetch(url,{headers:h});
              if(r.status===429){await sleep(1200+i*1000);continue;}
              if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
              return await r.json();
            }
            throw new Error('rate limit');
          }
          const events=[];
          for(let offset=0;offset<1000;offset+=50){
            const p=await getJson(`https://api.hiro.so/extended/v1/contract/${C}/events?limit=50&offset=${offset}`);
            const rows=p.results??[];
            for(const e of rows){
              const repr=e?.contract_log?.value?.repr??'';
              if(repr.includes('set-custom-cooldown')) events.push({tx_id:e.tx_id,repr});
            }
            if(rows.length<50) break;
            await sleep(KEY?30:200);
          }
          // Hiro returns newest first. First event seen for a principal is current state.
          const current=new Map();
          const rePrincipal=/\(principal '([^\)]+)\)/;
          const reNew=/\(new-value u(\d+)\)/;
          const reOld=/\(old-value u(\d+)\)/;
          for(const e of events){
            const principal=e.repr.match(rePrincipal)?.[1];
            if(!principal || current.has(principal)) continue;
            current.set(principal,{
              principal,
              newValue:Number(e.repr.match(reNew)?.[1]??-1),
              oldValue:Number(e.repr.match(reOld)?.[1]??-1),
              tx_id:e.tx_id,
              isContract:principal.includes('.'),
            });
          }
          console.log(`CURRENT_CUSTOM_COUNT=${current.size}`);
          for(const x of current.values()) console.log('CURRENT_CUSTOM='+JSON.stringify(x));
          const zero=[...current.values()].filter(x=>x.newValue===0);
          console.log(`CURRENT_ZERO_COUNT=${zero.length}`);
          console.log(`CURRENT_ZERO_CONTRACT_COUNT=${zero.filter(x=>x.isContract).length}`);
          console.log(`CURRENT_ZERO_STANDARD_COUNT=${zero.filter(x=>!x.isContract).length}`);
          for(const x of zero) console.log('CURRENT_ZERO='+JSON.stringify(x));
          NODE
