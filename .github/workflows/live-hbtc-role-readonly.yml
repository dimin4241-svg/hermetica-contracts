name: Live hBTC sweep reward gap correlation

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Correlate latest sweep reward pairs and user vault actions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const O='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const Z=`${O}.zest-interface-hbtc-v1`, C=`${O}.controller-hbtc-v1`, V=`${O}.vault-hbtc-v1-2`;
          const KEY=process.env.HIRO_API_KEY||'';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(url){
            for(let i=0;i<8;i++){
              const h={accept:'application/json'}; if(KEY) h['x-api-key']=KEY;
              const r=await fetch(url,{headers:h});
              if(r.status===429){await sleep(700+i*700);continue;}
              if(!r.ok) throw new Error(`${r.status} ${url} ${await r.text()}`);
              return await r.json();
            }
            throw new Error('rate limit '+url);
          }
          async function page(contract){return (await req(`https://api.hiro.so/extended/v1/contract/${contract}/events?limit=50&offset=0`)).results??[];}
          const ze=await page(Z), ce=await page(C), ve=await page(V);
          const sweeps=ze.map(e=>({e,repr:e?.contract_log?.value?.repr??''})).filter(x=>x.repr.includes('(action "sweep")')).map(x=>({tx:x.e.tx_id,amount:Number(x.repr.match(/\(amount u(\d+)\)/)?.[1]??-1),repr:x.repr}));
          const rewards=ce.map(e=>({e,repr:e?.contract_log?.value?.repr??''})).filter(x=>x.repr.includes('(action "log-reward")')).map(x=>({tx:x.e.tx_id,amount:Number(x.repr.match(/\(gross u(\d+)\)/)?.[1]??-1),positive:x.repr.includes('(is-positive true)'),repr:x.repr}));
          console.log(`LATEST_SWEEPS=${sweeps.length}`);
          console.log(`LATEST_REWARDS=${rewards.length}`);
          async function tx(id){
            const t=await req(`https://api.hiro.so/extended/v1/tx/${id}`);
            return {tx_id:id,block_height:t.block_height,burn_block_time:t.burn_block_time,burn_block_time_iso:t.burn_block_time_iso,sender:t.sender_address,status:t.tx_status,contract_call:t.contract_call?{contract_id:t.contract_call.contract_id,function_name:t.contract_call.function_name}:null};
          }
          let shown=0;
          for(const s of sweeps){
            const r=rewards.find(x=>x.amount===s.amount);
            if(!r) continue;
            const st=await tx(s.tx), rt=await tx(r.tx);
            const gapBlocks=(rt.block_height??0)-(st.block_height??0);
            const gapSeconds=(rt.burn_block_time??0)-(st.burn_block_time??0);
            console.log('PAIR='+JSON.stringify({amount:s.amount,positive:r.positive,sweep:st,reward:rt,gapBlocks,gapSeconds,sameTx:s.tx===r.tx}));
            shown++; if(shown>=8) break;
          }
          const vaultActions=[];
          for(const e of ve){
            const repr=e?.contract_log?.value?.repr??'';
            const action=repr.match(/\(action \"([^\"]+)\"\)/)?.[1]??'';
            if(['deposit','fund-claim','fund-claim-many','process-claim','request-redeem'].includes(action)) vaultActions.push({tx:e.tx_id,action,repr});
          }
          console.log(`VAULT_RELEVANT_LATEST=${vaultActions.length}`);
          for(const a of vaultActions.slice(0,20)){
            const t=await tx(a.tx);
            console.log('VAULT_ACTION='+JSON.stringify({action:a.action,tx:t,repr:a.repr}));
          }
          NODE
