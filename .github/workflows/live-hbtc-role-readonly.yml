name: hBTC express fixed-window PoC

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
      - tests/hbtc/express-boundary-poc.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run standalone express boundary PoC
        run: npx vitest run tests/hbtc/express-boundary-poc.test.ts --reporter=verbose
