name: Live hBTC claim custody invariant probe

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-role-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile newest outstanding v1-2 claims against escrow balances
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Cl, serializeCV, deserializeCV, cvToJSON } from '@stacks/transactions';

          const HBTC = 'SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const SBTC = 'SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4';
          const VAULT = `${HBTC}.vault-hbtc-v1-2`;
          const API_KEY = process.env.HIRO_API_KEY || '';
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          function hex(cv) {
            const raw = serializeCV(cv);
            if (typeof raw === 'string') return raw.startsWith('0x') ? raw : `0x${raw}`;
            return `0x${Buffer.from(raw).toString('hex')}`;
          }

          async function read(addr, name, fn, args = []) {
            const url = `https://api.hiro.so/v2/contracts/call-read/${addr}/${name}/${fn}`;
            const body = JSON.stringify({ sender: HBTC, arguments: args.map(hex) });
            for (let attempt = 0; attempt < 12; attempt++) {
              const headers = { 'content-type': 'application/json' };
              if (API_KEY) headers['x-api-key'] = API_KEY;
              const r = await fetch(url, { method: 'POST', headers, body });
              if (r.status === 429) {
                const wait = 5000 + attempt * 3000;
                console.log(`rate_limit fn=${fn} attempt=${attempt + 1} wait_ms=${wait}`);
                await sleep(wait);
                continue;
              }
              if (!r.ok) throw new Error(`${fn}: HTTP ${r.status} ${await r.text()}`);
              const j = await r.json();
              if (!j.result) throw new Error(`${fn}: ${JSON.stringify(j)}`);
              return cvToJSON(deserializeCV(j.result));
            }
            throw new Error(`${fn}: rate limit retries exhausted`);
          }

          function uintValue(j) {
            if (j.success === true) return BigInt(j.value.value);
            return BigInt(j.value);
          }

          const maxId = Number(uintValue(await read(HBTC, 'state-hbtc-v1', 'get-claim-id')));
          const principalArg = Cl.principal(VAULT);
          const hbtcBalance = uintValue(await read(HBTC, 'token-hbtc', 'get-balance', [principalArg]));
          const sbtcBalance = uintValue(await read(SBTC, 'sbtc-token', 'get-balance', [principalArg]));

          console.log(`global_claim_id=${maxId}`);
          console.log(`vault_hbtc_balance=${hbtcBalance}`);
          console.log(`vault_sbtc_balance=${sbtcBalance}`);
          console.log(`hiro_api_key_present=${API_KEY ? 'yes' : 'no'}`);

          let unfundedShares = 0n;
          let fundedAssets = 0n;
          const outstanding = [];
          let scanned = 0;
          let firstMatchedAt = null;

          for (let id = maxId; id >= 1; id--) {
            const j = await read(HBTC, 'vault-hbtc-v1-2', 'get-claim', [Cl.uint(id)]);
            scanned++;
            if (j.success === true) {
              const t = j.value.value;
              const shares = BigInt(t.shares.value);
              const assetsNode = t.assets.value;
              const funded = assetsNode !== null;
              const assets = funded ? BigInt(assetsNode.value) : null;
              if (funded) fundedAssets += assets;
              else unfundedShares += shares;
              const row = {
                id,
                user: t.user.value,
                shares: shares.toString(),
                funded,
                assets: assets?.toString() ?? null,
                fee: t.fee.value === null ? null : t.fee.value.value,
                express: t['is-express'].value,
                ts: t.ts.value,
              };
              outstanding.push(row);
              console.log('claim=' + JSON.stringify(row));
            }

            if (unfundedShares === hbtcBalance && fundedAssets === sbtcBalance) {
              firstMatchedAt = id;
              break;
            }
            await sleep(API_KEY ? 80 : 1000);
          }

          console.log(`scanned_claim_ids=${scanned}`);
          console.log(`outstanding_claims_found=${outstanding.length}`);
          console.log(`sum_unfunded_shares=${unfundedShares}`);
          console.log(`sum_funded_assets=${fundedAssets}`);
          console.log(`hbtc_escrow_delta=${hbtcBalance - unfundedShares}`);
          console.log(`sbtc_escrow_delta=${sbtcBalance - fundedAssets}`);
          console.log(`matched_at_claim_id=${firstMatchedAt ?? 'none'}`);
          console.log(`INVARIANT_HBTC_ESCROW=${hbtcBalance === unfundedShares ? 'EXACT' : 'MISMATCH'}`);
          console.log(`INVARIANT_SBTC_ESCROW=${sbtcBalance === fundedAssets ? 'EXACT' : 'MISMATCH'}`);
          NODE
