name: hBTC Hermetica Cooldown Recon

on:
  push:
    branches:
      - validation-usdh-jit-reward-poc
    paths:
      - 'tests/security/usdh/read-live-hbtc-hermetica-cooldown.mjs'
      - '.github/workflows/hbtc-hermetica-cooldown-recon.yml'
  workflow_dispatch:

jobs:
  cooldown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read live hBTC Hermetica staking cooldown
        run: node tests/security/usdh/read-live-hbtc-hermetica-cooldown.mjs
      - name: Upload cooldown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbtc-hermetica-cooldown-recon
          path: tests/security/evidence/live-hbtc-hermetica-cooldown.json
          if-no-files-found: warn
