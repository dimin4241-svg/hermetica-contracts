name: USDh Zombie Custody Recon

on:
  push:
    branches:
      - validation-usdh-jit-reward-poc
    paths:
      - 'tests/security/usdh/read-live-usdh-zombie-custody.mjs'
      - '.github/workflows/usdh-zombie-custody-recon.yml'
  workflow_dispatch:

jobs:
  zombie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Scan removed integration contracts for retained assets
        run: node tests/security/usdh/read-live-usdh-zombie-custody.mjs
      - name: Upload zombie custody evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdh-zombie-custody-recon
          path: tests/security/evidence/live-usdh-zombie-custody.json
          if-no-files-found: warn
