name: hBTC residual-supply State PoC

on:
  push:
    branches: [evidence/live-hbtc-role-readonly]
    paths:
      - .github/workflows/residual-poc.yml
      - security/residual-poc/**
      - mainnet/contracts/hbtc/protocol/state-v1.clar
      - mainnet/contracts/hbtc/tokens/token-hbtc.clar
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run isolated production-State proof
        run: node security/residual-poc/run.mjs
