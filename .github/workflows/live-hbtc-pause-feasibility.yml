name: Live hBTC pause feasibility

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-pause-feasibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read current claim and reserve state only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Cl, serializeCV, deserializeCV, cvToString } from '@stacks/transactions';
          const O='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const V=`${O}.vault-hbtc-v1-2`;
          const S=`${O}.state-hbtc-v1`;
          const R=`${O}.reserve-hbtc-v1`;
          const SBTC='SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token';
          const KEY=process.env.HIRO_API_KEY||'';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(url,opts={}){
            for(let i=0;i<10;i++){
              const headers={accept:'application/json',...(opts.headers||{})};
              if(KEY) headers['x-api-key']=KEY;
              const r=await fetch(url,{...opts,headers});
              if(r.status===429){await sleep(1000+i*800);continue;}
              if(!r.ok) throw new Error(`${r.status} ${url} ${await r.text()}`);
              return await r.json();
            }
            throw new Error('rate limit '+url);
          }
          function arg(cv){
            const x=serializeCV(cv);
            return typeof x === 'string' ? (x.startsWith('0x')?x:'0x'+x) : '0x'+Buffer.from(x).toString('hex');
          }
          async function ro(contract,fn,args=[]){
            const dot=contract.indexOf('.');
            const j=await req(`https://api.hiro.so/v2/contracts/call-read/${contract.slice(0,dot)}/${contract.slice(dot+1)}/${fn}`,{
              method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:O,arguments:args.map(arg)})
            });
            if(!j.okay) throw new Error(`${fn}: ${JSON.stringify(j)}`);
            return cvToString(deserializeCV(j.result));
          }
          const claim=await ro(V,'get-claim',[Cl.uint(116)]);
          const reserveBal=await ro(SBTC,'get-balance',[Cl.principal(R)]);
          const redeemEnabled=await ro(S,'get-redeem-enabled');
          const now=Math.floor(Date.now()/1000);
          console.log(`NOW_UNIX=${now}`);
          console.log(`CLAIM_116=${claim}`);
          console.log(`RESERVE_SBTC=${reserveBal}`);
          console.log(`REDEEM_ENABLED=${redeemEnabled}`);
          NODE
