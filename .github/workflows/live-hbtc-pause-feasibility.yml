name: Live hBTC pause feasibility

on:
  push:
    branches:
      - evidence/live-hbtc-role-readonly
    paths:
      - .github/workflows/live-hbtc-pause-feasibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read current claim, funding, and redeem-pause history only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Cl, serializeCV, deserializeCV, cvToString } from '@stacks/transactions';
          const O='SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D';
          const V=`${O}.vault-hbtc-v1-2`;
          const S=`${O}.state-hbtc-v1`;
          const R=`${O}.reserve-hbtc-v1`;
          const SBTC='SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token';
          const KEY=process.env.HIRO_API_KEY||'';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(url,opts={}){
            for(let i=0;i<12;i++){
              const headers={accept:'application/json',...(opts.headers||{})};
              if(KEY) headers['x-api-key']=KEY;
              const r=await fetch(url,{...opts,headers});
              if(r.status===429){await sleep(1000+i*800);continue;}
              if(!r.ok) throw new Error(`${r.status} ${url} ${await r.text()}`);
              return await r.json();
            }
            throw new Error('rate limit '+url);
          }
          function arg(cv){
            const x=serializeCV(cv);
            return typeof x === 'string' ? (x.startsWith('0x')?x:'0x'+x) : '0x'+Buffer.from(x).toString('hex');
          }
          async function ro(contract,fn,args=[]){
            const dot=contract.indexOf('.');
            const j=await req(`https://api.hiro.so/v2/contracts/call-read/${contract.slice(0,dot)}/${contract.slice(dot+1)}/${fn}`,{
              method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:O,arguments:args.map(arg)})
            });
            if(!j.okay) throw new Error(`${fn}: ${JSON.stringify(j)}`);
            return cvToString(deserializeCV(j.result));
          }
          const claim=await ro(V,'get-claim',[Cl.uint(116)]);
          const reserveBal=await ro(SBTC,'get-balance',[Cl.principal(R)]);
          const redeemEnabled=await ro(S,'get-redeem-enabled');
          const now=Math.floor(Date.now()/1000);
          console.log(`NOW_UNIX=${now}`);
          console.log(`CLAIM_116=${claim}`);
          console.log(`RESERVE_SBTC=${reserveBal}`);
          console.log(`REDEEM_ENABLED=${redeemEnabled}`);

          let processCount=0, nonManagerCount=0, managerCount=0, batchCount=0;
          outer: for(let offset=0;offset<1000;offset+=50){
            const page=await req(`https://api.hiro.so/extended/v1/contract/${V}/events?limit=50&offset=${offset}`);
            for(const e of page.results??[]){
              const repr=e?.contract_log?.value?.repr??'';
              if(!repr.includes('(action "process-claim")')) continue;
              processCount++;
              if(repr.includes('(manager (some false))')){
                nonManagerCount++;
                console.log('NON_MANAGER_PROCESS='+JSON.stringify({tx_id:e.tx_id,block_height:e.block_height,repr}));
              } else if(repr.includes('(manager (some true))')){
                managerCount++;
              } else if(repr.includes('(manager none)')){
                batchCount++;
              }
            }
            if((page.results??[]).length<50) break;
            await sleep(100);
          }
          console.log(`PROCESS_COUNTS total=${processCount} non_manager=${nonManagerCount} manager=${managerCount} batch_none=${batchCount}`);

          let scanned=0, pauseEvents=0;
          for(let offset=0;offset<10000;offset+=50){
            const page=await req(`https://api.hiro.so/extended/v1/contract/${S}/events?limit=50&offset=${offset}`);
            const rows=page.results??[];
            scanned+=rows.length;
            for(const e of rows){
              const repr=e?.contract_log?.value?.repr??'';
              if(repr.includes('(action "disable-redeem")') || repr.includes('(action "set-redeem-enabled")')){
                pauseEvents++;
                console.log('REDEEM_FLAG_EVENT='+JSON.stringify({tx_id:e.tx_id,block_height:e.block_height,burn_block_time:e.burn_block_time,repr}));
              }
            }
            if(rows.length<50) break;
            await sleep(75);
          }
          console.log(`STATE_EVENTS_SCANNED=${scanned}`);
          console.log(`REDEEM_FLAG_EVENTS=${pauseEvents}`);
          NODE
